<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Party Visualizer — local Hydra runner</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #hydra-canvas { width: 100%; height: 100%; display: block; background: #000; }

  #panel {
    position: fixed; top: 0; left: 0; width: 420px; height: 100%;
    background: rgba(15,15,18,0.92); color: #ddd; z-index: 10;
    display: flex; flex-direction: column; padding: 14px;
    border-right: 1px solid #333; backdrop-filter: blur(4px);
    transition: transform 0.2s ease;
  }
  #panel.hidden { transform: translateX(-100%); }

  h1 { font-size: 15px; margin: 0 0 4px; color: #7CFC9A; letter-spacing: 0.5px; }
  .sub { font-size: 11px; color: #888; margin-bottom: 12px; }

  select, button, textarea {
    font-family: 'Cascadia Code', Consolas, monospace;
    background: #1c1c20; color: #ddd; border: 1px solid #3a3a40;
    border-radius: 5px; padding: 6px 8px; font-size: 12.5px;
  }
  select { width: 100%; margin-bottom: 8px; }
  #desc { font-size: 11.5px; color: #9a9a9a; margin-bottom: 10px; min-height: 28px; }

  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  button { cursor: pointer; flex: 1; }
  button:hover { background: #2a2a30; }
  #run { background: #1e5c33; border-color: #2e7d46; color: #d6ffe0; font-weight: 600; }
  #run:hover { background: #256e3d; }

  textarea#code {
    flex: 1; width: 100%; resize: none; font-size: 12.5px; line-height: 1.5;
    white-space: pre; tab-size: 2;
  }

  #status { font-size: 11px; margin-top: 8px; padding: 6px 8px; border-radius: 4px; min-height: 14px; }
  .ok { background: #123a1e; color: #8fe6a8; }
  .err { background: #3a1414; color: #ff9b9b; white-space: pre-wrap; }

  #toggle {
    position: fixed; top: 10px; left: 10px; z-index: 11;
    background: rgba(20,20,24,0.85); color: #ddd; border: 1px solid #444;
    border-radius: 5px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  #panel:not(.hidden) ~ #toggle { left: 432px; }
  .hint { font-size: 10.5px; color: #666; margin-top: 6px; }
</style>
</head>
<body>

<div id="stage"><canvas id="hydra-canvas"></canvas></div>

<div id="panel">
  <h1>PARTY VISUALIZER</h1>
  <div class="sub">local Hydra runner — no internet needed once loaded</div>

  <select id="picker"></select>
  <div id="desc"></div>

  <textarea id="code" spellcheck="false"></textarea>

  <div class="row" style="margin-top:8px;">
    <button id="run" title="Ctrl+Enter">▶ Run  (Ctrl+Enter)</button>
    <button id="fullscreen" title="F">⛶ Fullscreen</button>
    <button id="hidePanel" title="Ctrl+H">Hide panel</button>
  </div>

  <div id="status"></div>
  <div class="hint">Camera + mic permission prompts appear on first Run. Edit the code freely — it's just JS, hit Run again after changes.</div>
  <div class="hint"><a href="https://github.com/itstomekk/party-visualizer" target="_blank" rel="noopener" style="color:#7CFC9A">Source (AGPL-3.0) · Hydra by Olivia Jack</a></div>
</div>

<button id="toggle" title="Ctrl+H">☰ panel</button>

<script src="vendor/hydra-synth.js"></script>
<script>
  const canvas = document.getElementById('hydra-canvas');

  function sizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  const hydra = new Hydra({
    canvas,
    detectAudio: true,   // mic-reactive sketches need this; browser will prompt
    makeGlobal: true,
    width: canvas.width,
    height: canvas.height,
  });

  const picker = document.getElementById('picker');
  const desc = document.getElementById('desc');
  const codeBox = document.getElementById('code');
  const status = document.getElementById('status');

  let manifest = [];

  async function loadManifest() {
    const res = await fetch('sketches/manifest.json');
    manifest = await res.json();
    picker.innerHTML = manifest.map((s, i) => `<option value="${i}">${s.name}</option>`).join('');
    await loadSketch(0);
  }

  async function loadSketch(i) {
    const entry = manifest[i];
    desc.textContent = entry.desc;
    const res = await fetch(entry.file);
    codeBox.value = await res.text();
  }

  picker.addEventListener('change', () => loadSketch(picker.value));

  function runCode() {
    try {
      // reset output/sources so old feedback loops from a previous sketch don't linger
      new Function(codeBox.value)();
      status.textContent = '✓ running';
      status.className = 'ok';
    } catch (e) {
      status.textContent = 'Error: ' + e.message;
      status.className = 'err';
      console.error(e);
    }
  }

  document.getElementById('run').addEventListener('click', runCode);

  document.getElementById('fullscreen').addEventListener('click', () => {
    document.documentElement.requestFullscreen?.();
  });

  document.getElementById('hidePanel').addEventListener('click', togglePanel);
  document.getElementById('toggle').addEventListener('click', togglePanel);

  function togglePanel() {
    document.getElementById('panel').classList.toggle('hidden');
  }

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); runCode(); }
    if (e.ctrlKey && (e.key === 'h' || e.key === 'H')) { e.preventDefault(); togglePanel(); }
    if (e.key === 'f' || e.key === 'F') {
      if (document.activeElement !== codeBox) document.documentElement.requestFullscreen?.();
    }
  });

  loadManifest();
</script>
</body>
</html>
